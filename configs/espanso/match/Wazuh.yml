matches:
  - triggers: [";gm", ";wt"]
    label: "[Good Morning]"
    force_clipboard: true
    replace: "Good morning! Work thread :thread:"
  - triggers: [";wz", ";wdev"]
    label: "[Wazuh] Start"
    force_clipboard: true
    replace: "yarn start --no-base-path"
  - triggers: [";wz", ";wdaily"]
    label: "[Wazuh] Daily Report"
    force_clipboard: true
    replace: |
      # Guido Modarelli - {{short_date}}

      ## Development

      ### Worked on

      *

      ### Reviews

      *

      ## Operational

      ### Worked on

      *

      ### Reviews

      *

      ## Meetings

      *

      ## Miscellaneous

      *

  - triggers: [";wz", ";wnote"]
    label: "[Wazuh] Note"
    force_clipboard: true
    replace: "{{note}}"
    vars:
      - name: note
        type: choice
        params:
          values:
            - label: WAITING FOR USER'S RESPONSE
              id: Waiting for user's response
  - triggers: [";wz", ";wobj"]
    label: "[Wazuh] Objective"
    force_clipboard: true
    replace: "{{objective}}"
    vars:
      - name: objective
        type: choice
        params:
          values:
            - Community
            - Quick win
            - Testing Release
  - triggers: [";wz", ";wdoc", ";wdgen"]
    label: "[Wazuh] Generate Doc"
    force_clipboard: true
    replace: |
      OUTPUT=wazuh-doc_$(git branch --show-current).txt &&
      fd . source/user-manual \
        --type f \
        --extension='rst' \
        --exclude='release-notes/' \
        --exclude='installation-guide/' \
        --exclude='deployment-options/' |
      xargs cat > $OUTPUT &&
      mv $OUTPUT /mnt/c/Users/$USERNAME/OneDrive/Documents
  - triggers: [";wz", ";wshowpass"]
    label: "[Wazuh] Show Password"
    force_clipboard: true
    replace: sudo tar -O -xvf wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt
  - triggers: [";wz", ";wvis"]
    label: "[Wazuh] Visualizations"
    force_clipboard: true
    replace: |
      <context>
        En un entorno de seguridad informática con Wazuh (basado en OpenSearch), quiero definir un KPI que se exprese mediante un único valor numérico —sin gráficos— y que, a partir de los datos mostrados en las imágenes (donde cada imagen representa un solo documento y existen muchísimos similares), identifique los campos más relevantes para generar métricas claras y útiles para el cliente final.

        - El KPI debe ser **fácil de entender** y **relevante** para el cliente.
        - Debe incluir una **breve descripción** de lo que representa el KPI y su **importancia**.
        - El KPI debe ser **específico**, **medible**, **alcanzable**, **relevante** y **temporal** (SMART).
        - El KPI debe ser **visualmente atractivo**, utilizando un formato claro y fácil de leer.
        - El KPI debe basarse en una agregación de los datos de todos los documentos relevantes dentro de un período de tiempo específico.
        - NO debe usar _Runtime fields_ ni _TSVB_.
      </context>
  - triggers: [";wz", ";wctx"]
    label: "[Wazuh] General Context"
    force_clipboard: true
    replace: |
      <context>
        # Contexto

        1. **Wazuh** es tanto una **empresa de seguridad informática** como una **plataforma modular** que se puede consumir de dos formas:
          - Mediante **Wazuh Cloud**, su oferta **SaaS** (incluye un trial de 14 días).
          - Como un **stack desplegable** en infraestructura propia (on-premise o en la nube).

        2. El stack de Wazuh está compuesto por varios **componentes estructurales**:
          - **Wazuh Dashboard**: fork de **OpenSearch Dashboard** (*no es Kibana*).
          - **Wazuh Indexer**: fork de **OpenSearch** (*no es el indexador de Elasticsearch*).
          - **Wazuh Server**, **Wazuh CTI**, **Wazuh Core**, **Wazuh Agent**, entre otros.

        3. Tanto **Wazuh Dashboard** como **Wazuh Indexer** se mantienen actualizados en sincronía con las versiones oficiales de **OpenSearch** y **OpenSearch Dashboard**, realizando adaptaciones internas según las necesidades del stack.

        4. La plataforma unifica capacidades de **XDR** y **SIEM**, permitiendo la detección de amenazas, recolección y correlación de logs, inteligencia de amenazas y control de endpoints.

        5. Soporta despliegues en entornos **on-premises**, **virtualizados**, **contenerizados** y **cloud-based**, con una arquitectura flexible y distribuible.

        6. Las referencias a **Dashboard**, **Indexer**, **Server**, etc., corresponden a los **componentes estructurales** del stack de Wazuh.

        7. El término **alertas** o **eventos** hace referencia a sucesos que **ocurren dentro de la plataforma Wazuh**, y no a conceptos genéricos.

        8. No se hace referencia al stack ELK (Elasticsearch, Logstash, Kibana), ni al Elasticsearch original, salvo mención explícita.

        9. Ten en cuenta que **Wazuh Indexer** y **Wazuh Dashboard** son forks activos y mantenidos del ecosistema **OpenSearch**; Wazuh no es un proyecto desarrollado 100% desde cero, sino que parte de OpenSearch. Por esto, pueden surgir problemas, bugs, ineficiencias, errores o advertencias que provengan tanto del fork original como de los cambios efectuados por Wazuh. Al analizar un inconveniente, es útil intentar determinar si el origen se encuentra en OpenSearch (en cuyo caso corresponde escalarlo al proyecto original) o en las modificaciones de Wazuh.

        10. Existen diferentes tipos de **Wazuh Agents** según el sistema operativo del endpoint:
            - **Windows**: versiones **Windows 10**, **Windows 11** y **Windows Server**.
            - **Linux**: distribuciones como **Ubuntu**, **CentOS** y otras compatibles.
            - **macOS**: versión **Ventura** o superior.

        11. Antes de iniciar cualquier solicitud o análisis relacionado con la plataforma, **siempre pregunta al usuario la versión de Wazuh que está utilizando**. En caso de que el usuario no conozca la versión, asume que se trata de la última versión disponible y obtén la información de la versión actual desde: https://documentation.wazuh.com/current/release-notes/index.html

        12. Toda información obtenida debe ser **contrastada y validada** en fuentes oficiales para garantizar que sea **compatible con la versión de Wazuh en cuestión**.

            - Si la persona que consulta (community/user) **especifica la versión**, la verificación debe hacerse contra esa versión concreta.
            - Si **no se especifica**, se debe asumir la última versión disponible en el último release oficial.

        Las fuentes prioritarias de consulta son:

            - **Documentación oficial:** [https://documentation.wazuh.com/](https://documentation.wazuh.com/)
            - **Blog oficial:** [https://wazuh.com/blog/](https://wazuh.com/blog/)
            - **Wazuh Repos**: https://github.com/wazuh

        No oficiales (respuestas a la comunidad):

            - **Google Groups (comunidad oficial):** [Wazuh | Mailing List - Google Groups](https://groups.google.com/g/wazuh)
            - **Reddit**: [Wazuh](https://www.reddit.com/r/Wazuh/)

        13. Ante errores visuales o fallas en carga de recursos (imágenes, temas, fuentes, archivos multimedia), primero descartar problemas de caché o firewall ejecutando los siguientes pasos:
            - Abrir el navegador en modo incógnito.
            - Acceder al Dashboard desde una IP alternativa.
            - Abrir DevTools > pestaña Network > activar “Disable cache”.
            - Vaciar el **Storage** desde DevTools: eliminar Local Storage, Session Storage y cookies.
            - Verificar si algún firewall o proxy está sirviendo versiones cacheadas.

        Utilizá este marco de referencia para interpretar todo lo que se indique a continuación, tanto a nivel técnico como funcional.

        Comienza por elaborar una checklist breve (3-7 puntos) que resuma los pasos clave a seguir antes de abordar cualquier solicitud o análisis relacionado con la plataforma. Valida siempre los resultados frente a las fuentes oficiales y asegúrate de que las respuestas estén alineadas con la versión de Wazuh en cuestión. Si surge un resultado o referencia potencialmente obsoleta o ambigua, recalca la necesidad de confirmación adicional antes de continuar.
      </context>
  - triggers: [";wz", ";widr", ";wedr"]
    label: "[Wazuh] Internal/External Devel Request"
    force_clipboard: true
    replace: |
      Cuando debas resolver un problema relacionado con un *Internal Level Request* o *External Level Request*, recibirás una lista de comentarios provenientes de una issue en GitHub. En dicha issue, diferentes compañeros pueden haber propuesto diversas soluciones o enfoques para abordar la necesidad del cliente.

      Antes de responder, comienza con una checklist concisa (3-7 puntos) de sub-tareas conceptuales que realizarás, como analizar comentarios, identificar soluciones existentes y generar alternativas. Analiza la conversación completa y evita proponer o repetir una solución que ya haya sido sugerida previamente por otro compañero en los comentarios del hilo. En su lugar, busca alternativas nuevas o enfoques diferentes para resolver el problema, aunque apunten al mismo objetivo final. Asegúrate de no duplicar ideas ni explicaciones ya mencionadas.

      Al finalizar, valida en 1-2 líneas que tu propuesta aporta un enfoque distinto respecto a lo ya sugerido, y procede o auto-corrige si identificas inadvertidamente una repetición.
