  - triggers: [";wz", ";wc", ";wcclose"]
    label: "[Community] Close"
    force_clipboard: true
    replace: "{{text}}"
    vars:
      - name: text
        type: choice
        params:
          values:
            - label: DELETED
              id: The user deleted the comment.
            - label: INACTIVITY
              id: We are closing due to inactivity.
            - label: HAS BEEN ANSWERED
              id: The user has already been answered [here]($|$).
            - label: HAS BEEN SOLVED
              id: The user has already been solved.
  - triggers: [";wz", ";wdoc", ";wdgen"]
    label: "[Wazuh] Generate Doc"
    force_clipboard: true
    replace: |
      OUTPUT=wazuh-doc_$(git branch --show-current).txt &&
      fd . source/user-manual \
        --type f \
        --extension='rst' \
        --exclude='release-notes/' \
        --exclude='installation-guide/' \
        --exclude='deployment-options/' |
      xargs cat > $OUTPUT &&
      mv $OUTPUT /mnt/c/Users/$USERNAME/OneDrive/Documents
  - triggers: [";wz", ";wshowpass"]
    label: "[Wazuh] Show Password"
    force_clipboard: true
    replace: sudo tar -O -xvf wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt
  - triggers: [";wz", ";wvis"]
    label: "[Wazuh] Visualizations"
    force_clipboard: true
    replace: |
      <context>
        En un entorno de seguridad informática con Wazuh (basado en OpenSearch), quiero definir un KPI que se exprese mediante un único valor numérico —sin gráficos— y que, a partir de los datos mostrados en  las imagenes (donde cada imagen representa un solo documento y existen muchísimos similares), identifique los campos más relevantes para generar métricas claras y útiles para el cliente final.

        - El KPI debe ser **fácil de entender** y **relevante** para el cliente.
        - Debe incluir una **breve descripción** de lo que representa el KPI y su **importancia**.
        - El KPI debe ser **específico**, **medible**, **alcanzable**, **relevante** y **temporal** (SMART).
        - El KPI debe ser **visualmente atractivo**, utilizando un formato claro y fácil de leer.
        - El KPI debe basarse en una agregación de los datos de todos los documentos relevantes dentro de un período de tiempo específico.
        - NO debe usar _Runtime fields_ ni _TSVB_.
      </context>
  - triggers: [";wz", ";wctx"]
    label: "[Wazuh] General Context"
    force_clipboard: true
    replace: |
      <context>
        Antes de continuar, tené en cuenta este contexto:

        1. **Wazuh** es tanto una **empresa de seguridad informática** como una **plataforma modular** que puede consumirse de dos formas:
          - A través de **Wazuh Cloud**, su oferta **SaaS** (con trial de 14 días).
          - Como un **stack desplegable** en infraestructura propia del cliente (on-premise o en la nube).
        2. El stack de Wazuh está compuesto por varios **componentes estructurales**:
          - **Wazuh Dashboard**: fork de **OpenSearch Dashboard** (*no es Kibana*).
          - **Wazuh Indexer**: fork de **OpenSearch** (*no es el indexador de Elasticsearch*).
          - **Wazuh Server**, **Wazuh CTI**, **Wazuh Core**, **Wazuh Agent**, entre otros.
        3. Tanto **Wazuh Dashboard** como **Wazuh Indexer** se mantienen actualizados en sincronía con las versiones oficiales de **OpenSearch** y **OpenSearch Dashboard**, con adaptaciones internas según las necesidades del stack.
        4. La plataforma unifica capacidades de **XDR y SIEM**, permitiendo detección de amenazas, recolección y correlación de logs, inteligencia de amenazas y control de endpoints.
        5. Soporta despliegues en entornos **on-premises**, **virtualizados**, **contenerizados** y **cloud-based**, con una arquitectura flexible que puede ser distribuida.
        6. Cuando menciono **Dashboard**, **Indexer**, **Server**, etc., me refiero a los **componentes estructurales** del stack de Wazuh.
        7. Cuando hablo de **alertas** o **eventos**, me refiero a sucesos que **ocurren dentro de la plataforma Wazuh**, no a conceptos genéricos.
        8. No estoy hablando del stack ELK (Elasticsearch, Logstash, Kibana), ni del Elasticsearch original, salvo que lo indique explícitamente.
        9. Toda búsqueda, inferencia o análisis técnico debe asumir que **Wazuh Indexer** y **Wazuh Dashboard** son forks activos, mantenidos y adaptados del ecosistema **OpenSearch**.
        10. Existen diferentes tipos de **Wazuh Agents** según el sistema operativo del endpoint donde se instalan. Actualmente se soportan:
            - **Windows**: versiones **Windows 10**, **Windows 11** y también **Windows Server**.
            - **Linux**: distribuciones como **Ubuntu**, **CentOS** y otras compatibles.
            - **macOS**: versión **Ventura** o superior.
        11. La versión actual de Wazuh es **v4.12**. Siempre que se consulte documentación, blog o contenido externo, se debe verificar que la información sea compatible con esta versión, y no estar obsoleta o limitada a versiones anteriores del stack.
        12. Siempre que necesites ampliar, validar o enriquecer la información sobre Wazuh, consultá primero:
            - La documentación oficial: https://documentation.wazuh.com/
            - El blog oficial: https://wazuh.com/blog/
        13. Ante errores visuales o fallas en carga de recursos (como imágenes, temas claro/oscuro, fuentes o archivos multimedia), se deben descartar primero problemas de caché o interferencia de firewall con los siguientes pasos:
            - Abrir el navegador en modo incógnito.
            - Acceder al Dashboard desde una IP alternativa.
            - Abrir las DevTools → pestaña Network → activar “Disable cache”.
            - Vaciar el **Storage** desde DevTools: eliminar Local Storage, Session Storage y Cookies.
            - Verificar si un firewall o proxy intermedio podría estar sirviendo versiones cacheadas.

        Usá este marco de referencia para interpretar lo que diga a continuación, tanto en términos técnicos como funcionales.
      </context>
