matches:
  - triggers: [";gm", ";wt"]
    label: "[Good Morning]"
    force_clipboard: true
    replace: "Good morning! Work thread :thread:"
  - triggers: [";wz", ";wdev"]
    label: "[Wazuh] Start"
    force_clipboard: true
    replace: "yarn start --no-base-path"
  - triggers: [";wz", ";wfmt"]
    label: "[Wazuh] Format"
    force_clipboard: true
    replace: "echo '' | awk '{print $2}' | xargs -I{} ./plugins/main/node_modules/.bin/prettier --write {} --config .prettierrc"
  - triggers: [";wz", ";wdaily"]
    label: "[Wazuh] Daily Report"
    force_clipboard: true
    replace: |
      # Guido Modarelli - {{short_date}}

      ## Development

      ### Triage

      *

      ### Newly opened

      *

      ### Worked on

      *

      ### Reviews

      *

      ## Operational

      ### Triage

      *

      ### Newly opened

      *

      ### Worked on

      *

      ### Reviews

      *

