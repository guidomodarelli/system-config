[features]
# Habilita modos de colaboración como plan mode.
#
# Beneficio: ayuda a que Codex trabaje con modos más estructurados para
# planificar antes de ejecutar.
collaboration_modes = true
default_mode_request_user_input = false
goals = true
hooks = true
js_repl = false
memories = true
mentions_v2 = true
multi_agent = false
prevent_idle_sleep = true
responses_websockets = true
# Sirve para capturar el entorno del shell y acelerar comandos repetidos. La
# docs la describen como una forma de “snapshot your shell environment to speed
# up repeated commands”.
#
# Beneficia más cuando trabajás en repos con muchos comandos iterativos, shells
# con bastante inicialización, o sesiones largas.
#
# Mi recomendación: sí la usaría en local, salvo que notes comportamientos raros
# con variables de entorno que cambian mucho durante la sesión.
shell_snapshot = true
terminal_resize_reflow = true
plugin_hooks = true

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
command = """echo '{"systemMessage":"🦴 Caveman mode ON","hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":"CAVEMAN MODE ACTIVE (full). Rules: drop articles (a/an/the/el/la/un/una), filler (just/really/basically/actually/solo/simplemente), pleasantries (sure/of course/happy to/claro/con gusto), hedging (maybe/perhaps/I think/quizas/creo que). Fragments OK. Short synonyms. Exact technical terms. Pattern: [thing] [action] [reason]. [next step]. Match user language immediately. Off only when user says: stop caveman / normal mode / modo normal."}}' """
statusMessage = "🦴 Caveman mode ON"
timeout = 5
type = "command"

