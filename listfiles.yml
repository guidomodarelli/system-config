# yaml-language-server: $schema=schema.json
paths:
  - path: .antigen/bundles/guidomodarelli/anyframe
    target: .antigen/bundles/guidomodarelli
  - path: .config/rofi
    target: .config
    excludeFor:
      - wsl: true
  - path: .config/nvim
    target: .config
  - path: lazygit
    target: .config
    overrides:
      - platform: darwin
        target: Library/Application Support/lazygit
  - path: zsh/.zsh
  - path: zsh/.antigenrc
  - path: zsh/.zshrc
  - path: zsh/.oh-my-zsh/themes/murilasso.zsh-theme
    target: .oh-my-zsh/themes
  - path: git/.gitconfig
  - path: .curlrc
  - path: root/etc/pacman.conf
    target: /etc
    onlyFor:
      - platform: linux
        linuxDistro: arch
  - path: .config/espanso
    target: .config
    overrides:
      - target: WSL://AppData/Roaming
        wsl: true
  - path: PowerShell/*
    target: WSL://OneDrive/Documents/PowerShell
    onlyFor:
      - wsl: true
