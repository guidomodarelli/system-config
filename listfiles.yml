# yaml-language-server: $schema=schema.json
paths:
  - path: .antigen/bundles/guidomodarelli/anyframe
    target: .antigen/bundles/guidomodarelli
  - path: .config/awesome
    target: .config
  - path: .config/espanso
    target: .config
  - path: .config/ranger
    target: .config
  - path: .config/rofi
    target: .config
  - path: .config/scripts
    target: .config
  - path: .config/nvim
    target: .config
  - path: .config/lazygit
    target: .config
    overrides:
      - platform: darwin
        target: ~/Library/Application Support/lazygit
  - path: .config/Code/User/*
    target: .config/Code/User
    excludeFor:
      - platform: darwin
  - path: .tmux.conf
  - path: zsh/.zsh
  - path: zsh/.antigenrc
  - path: zsh/.zshrc
  - path: zsh/.oh-my-zsh/themes/murilasso.zsh-theme
    target: .oh-my-zsh/themes
  - path: .astylerc
  - path: .gitconfig
  - path: .curlrc
  - path: .gdbinit
  - path: .wezterm.lua
  - path: root/etc/pacman.conf
    target: /etc
    onlyFor:
      - platform: linux
        linuxDistro: arch
