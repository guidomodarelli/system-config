# yaml-language-server: $schema=schema.json
paths:
  - path: zsh/.zsh
    excludeFor:
      - platform: win32
  - path: zsh/.antigenrc
    excludeFor:
      - platform: win32
  - path: zsh/.zshrc
    excludeFor:
      - platform: win32
  - path: zsh/.oh-my-zsh/themes/murilasso.zsh-theme
    target: .oh-my-zsh/themes
    excludeFor:
      - platform: win32
  - path: espanso
    target: .config
    excludeFor:
      - wsl: true
    overrides:
      - target: AppData/Roaming
        platform: win32
  - path: ghostty/config.ghostty
    exactTarget: Library/Application Support/com.mitchellh.ghostty/config.ghostty
    onlyFor:
      - platform: darwin
  - path: PowerShell/Microsoft.PowerShell_profile.ps1
    target: $DOCUMENTS/PowerShell
    onlyFor:
      - platform: win32
  - path: PowerShell/Microsoft.PowerShell_profile.ps1
    target: $DOCUMENTS/WindowsPowerShell
    onlyFor:
      - platform: win32
  - path: .agents/skills/my-skills
    target: .agents/skills
  - path: .agents/skills/my-skills
    target: .claude/skills
  - path: .agents/skills/commands
    target: .agents/skills
  - path: .codex/AGENTS.md
    target: .codex/
  - path: .codex/AGENTS.md
    exactTarget: .claude/CLAUDE.md
  - path: .codex/config.toml
    target: .codex
  - path: .codex/skills/frontend-skill
    target: .codex/skills
  - path: $HOME/.codex/skills/.system
    exactTarget: .agents/skills/codex-system-skills
  - path: .codex/skills/.system/skill-creator
    target: .codex/skills/.system
