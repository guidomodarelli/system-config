# yaml-language-server: $schema=schema.json
paths:
  - path: zsh/.zsh
  - path: zsh/.antigenrc
  - path: zsh/.zshrc
  - path: zsh/.oh-my-zsh/themes/murilasso.zsh-theme
    target: .oh-my-zsh/themes
  - path: git/.gitconfig
  - path: espanso
    target: .config
    overrides:
      - target: WSL://AppData/Roaming
        wsl: true
  - path: PowerShell/*
    target: WSL://OneDrive/Documents/PowerShell
    onlyFor:
      - wsl: true
  - path: .codex/AGENTS.md
    target: .codex/
