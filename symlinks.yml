# yaml-language-server: $schema=schema.json
paths:
  - path: zsh/.zsh
  - path: zsh/.antigenrc
  - path: zsh/.zshrc
  - path: zsh/.oh-my-zsh/themes/murilasso.zsh-theme
    target: .oh-my-zsh/themes
  - path: espanso
    target: .config
    overrides:
      - target: WSL://AppData/Roaming
        wsl: true
  - path: PowerShell/*
    target: WSL://OneDrive/Documents/PowerShell
    onlyFor:
      - wsl: true
  - path: .agents/skills/my-skills
    target: .agents/skills
  - path: .codex/AGENTS.md
    target: .codex/
  - path: .codex/skills/frontend-skill
    target: .codex/skills
  - path: .codex/skills/.system/skill-creator/SKILL.md
    target: .agents/skills/.system/skill-creator
